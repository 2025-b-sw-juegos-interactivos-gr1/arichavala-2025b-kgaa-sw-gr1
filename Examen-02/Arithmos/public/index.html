<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmos: El Reino de los Números</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #87CEEB;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            display: block;
        }
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            z-index: 1000;
        }
        #loadingScreen h1 {
            margin: 10px;
            font-size: 48px;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <h1>✨ Arithmos ✨</h1>
        <p>Cargando el Reino de los Números...</p>
    </div>
    <canvas id="renderCanvas"></canvas>
</body>
</html>
